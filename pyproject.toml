[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "pakk-package-manager"
version = "0.4.0"
authors = [{ name = "Valentin Schröter", email = "vasc9380@th-wildau.de" }]
description = "Pakk Package Manager."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "braceexpand>=0.1.7",
    "click>=8.2.1",
    "click-aliases>=1.0.5",
    "extended-configparser>=1.2.2",
    "flock>=0.1",
    "graphviz>=0.21",
    "inquirerpy>=0.3.4",
    "jellyfish>=1.2.0",
    "jsons>=1.6.3", # Does not work for Python3.11 any more
    "markdown-plus>=0.1.4",
    "networkx>=3.4.2",
    "node-semver>=0.9.0",
    "prettytable>=3.16.0",
    "psutil>=7.0.0",
    "pyfiglet>=1.0.3",
    "pygithub>=2.6.1",
    "python-dotenv>=1.1.1",
    "python-gitlab>=6.1.0",
    "pytz>=2025.2",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "semver>=3.0.4",
    "tqdm>=4.67.1",
]
classifiers = ["Programming Language :: Python :: 3"]

[tool.hatch.build.targets.wheel]
packages = ["pakk"]

[project.urls]
Homepage = "https://github.com/icampus-wildau/pakk"
Issues = "https://github.com/icampus-wildau/pakk/issues"

[project.scripts]
pakk = "pakk.cli:cli"
